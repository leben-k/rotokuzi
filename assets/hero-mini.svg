<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ミニロトの抽せん球イラスト">
  <defs>
    <style>
      .f1 { animation: fl 3.2s ease-in-out infinite; }
      .f2 { animation: fl 3.6s ease-in-out infinite; animation-delay:.3s; }
      .f3 { animation: fl 3.9s ease-in-out infinite; animation-delay:.6s; }
      .f4 { animation: fl 3.4s ease-in-out infinite; animation-delay:.9s; }
      @keyframes fl { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
      @media (prefers-reduced-motion: reduce){ .f1,.f2,.f3,.f4{animation:none} }
      text{ font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; fill:#fff; }
    </style>
  </defs>
  <ellipse cx="280" cy="200" rx="220" ry="12" fill="#d7f4e3"/>

  <g class="f1">
    <circle cx="90" cy="70" r="34" fill="#1c9457" stroke="#0d1e30" stroke-width="2.5"/>
    <text x="90" y="80" font-size="28" text-anchor="middle">5</text>
  </g>
  <g class="f2">
    <circle cx="220" cy="45" r="24" fill="#4dbb80" stroke="#0d1e30" stroke-width="2.2"/>
    <text x="220" y="53" font-size="20" text-anchor="middle">1</text>
  </g>
  <g class="f3">
    <circle cx="340" cy="60" r="27" fill="#86d1ab" stroke="#0d1e30" stroke-width="2.2"/>
    <text x="340" y="69" font-size="22" text-anchor="middle">18</text>
  </g>
  <g class="f4">
    <circle cx="460" cy="90" r="30" fill="#1c9457" stroke="#0d1e30" stroke-width="2.5"/>
    <text x="460" y="99" font-size="24" text-anchor="middle">31</text>
  </g>
  <g class="f2">
    <circle cx="160" cy="150" r="20" fill="#ffc93c" stroke="#0d1e30" stroke-width="2"/>
    <text x="160" y="157" font-size="17" text-anchor="middle" fill="#5a3e00">?</text>
  </g>
  <g class="f3">
    <circle cx="400" cy="160" r="18" fill="#ffffff" stroke="#0d1e30" stroke-width="2"/>
    <text x="400" y="166" font-size="15" text-anchor="middle" fill="#0d1e30">?</text>
  </g>
</svg>

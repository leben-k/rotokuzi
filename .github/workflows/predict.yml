name: 予測数字の自動生成

on:
  schedule:
    # UTC 00:00 = JST 09:00 / 月(1) 火(2) 木(4) 金(5) に実行
    - cron: "0 0 * * 1,2,4,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r scripts/requirements.txt

      - name: 予測数字を生成
        working-directory: scripts
        run: python predict.py all

      - name: 変更をコミット
        run: |
          git config user.name "loto-bot"
          git config user.email "loto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 予測数字を自動生成 ($(date +'%Y-%m-%d'))"
          git push

name: 当せん結果の自動照合

on:
  schedule:
    # UTC 12:00 = JST 21:00 / 月(1) 火(2) 木(4) 金(5) に実行
    - cron: "0 12 * * 1,2,4,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-results:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r scripts/requirements.txt

      - name: 当せん番号を取得して照合
        working-directory: scripts
        run: python check_results.py all

      - name: 変更をコミット
        run: |
          git config user.name "loto-bot"
          git config user.email "loto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 当せん結果を自動反映 ($(date +'%Y-%m-%d'))"
          git push
